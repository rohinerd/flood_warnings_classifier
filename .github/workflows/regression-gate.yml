name: Regression gate

on:
  push:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pandas odfpy scikit-learn
      - run: python score.py
        env:
          AUC_THRESHOLD: "0.30"
